<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TubeExport - Format Universel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #FF0000; --bg: #f8f9fa; --text: #1f2937; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 20px; line-height: 1.5; }
        .container { max-width: 500px; margin: 20px auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 span { color: var(--primary); }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .benefit-item { background: #fff5f5; padding: 10px; border-radius: 10px; font-size: 0.8rem; font-weight: 600; margin-bottom: 10px; display: inline-block; margin-right: 5px; }
        .step { margin-bottom: 20px; }
        .btn-copy { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; transition: 0.2s; }
        .btn-copy:active { transform: scale(0.98); }
        code { background: #eee; padding: 2px 5px; border-radius: 4px; font-family: monospace; }
        .footer { text-align: center; font-size: 0.8rem; color: #999; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Tube<span>Export</span></h1>
        <div class="benefit-item">🔒 100% Privé</div>
        <div class="benefit-item">📱 Format NewPipe</div>
        <div class="benefit-item">⚡ Ultra Rapide</div>
    </div>

    <div class="card">
        <div class="step">
            <strong>1. Copier l'outil</strong><br>
            <button class="btn-copy" id="copyBtn" onclick="copyCode()">COPIER LE CODE</button>
        </div>
        <div class="step">
            <strong>2. Créer un favori</strong><br>
            Nommez-le <code>EXPORT</code> et collez le code dans l'adresse.
        </div>
        <div class="step">
            <strong>3. Exécuter</strong><br>
            Allez sur vos <a href="https://m.youtube.com/feed/channels" target="_blank">Abonnements</a>, puis cliquez sur le favori <code>EXPORT</code>.
        </div>
    </div>
    <div class="footer">Aucune donnée n'est envoyée sur un serveur.</div>
</div>

<script>
function copyCode() {
    // Version ultra-compressée pour éviter les bugs de navigateur
    const code = "javascript:(function(){var h=0,i=0,t=setInterval(function(){window.scrollTo(0,document.body.scrollHeight);if(i++>25||(h>0&&document.body.scrollHeight==h)){clearInterval(t);var c=[],s={},l=document.links;for(var j=0;j<l.length;j++){var a=l[j];if((a.href.indexOf('/@')>-1||a.href.indexOf('/channel/')>-1)&&a.innerText.length>2){if(!s[a.href]){c.push({service_id:0,url:a.href,name:a.innerText.trim()});s[a.href]=1;}}}if(c.length>0){var o={subscriptions:c,app_version:'0.28.6',app_version_int:1011};var b=new Blob([JSON.stringify(o)],{type:'application/json'}),u=URL.createObjectURL(b),d=document.createElement('a');d.href=u;d.download='export.json';d.click();alert(c.length+' chaines exportees');}else{alert('Erreur: Page vide?');}}h=document.body.scrollHeight;},1200);})()";
    
    const el = document.createElement('textarea');
    el.value = code;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    
    const btn = document.getElementById('copyBtn');
    btn.innerText = "✅ COPIÉ !";
    btn.style.background = "#059669";
    setTimeout(() => { btn.innerText = "COPIER LE CODE"; btn.style.background = "#FF0000"; }, 2000);
}
</script>

</body>
</html>
